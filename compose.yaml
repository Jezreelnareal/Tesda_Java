services:
  db:
    image: mysql:8.4
    container_name: jcash-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jcash_db
      MYSQL_USER: jcash
      MYSQL_PASSWORD: ${JCASH_DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - jcash_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  jcash_mysql_data: